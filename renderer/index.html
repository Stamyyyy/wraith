<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wraith</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar" id="titlebar">
    <div class="titlebar-icon">
      <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 8 L14 12 L6 16" stroke="#2fd98f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="16" y1="16" x2="19" y2="16" stroke="#2fd98f" stroke-width="2.2" stroke-linecap="round"/></svg>
    </div>
    <div class="titlebar-text" id="titlebar-text">Wraith</div>
    <div class="titlebar-btns">
      <button id="btn-min" title="Minimize">&#x2013;</button>
      <button id="btn-close" title="Hide to tray">&#x2715;</button>
    </div>
  </div>

  <div class="tabbar" id="tabbar">
    <div class="tabs" id="tabs-list"></div>
    <button class="tab-add" id="new-tab-btn" title="New tab">+</button>
    <button class="tab-settings" id="settings-btn" title="Settings">&#x2699;</button>
  </div>

  <div class="content-area" id="content-area">
    <div class="launcher" id="launcher">
      <div class="launcher-cubes">
        <div class="cube" data-type="wsl">
          <img src="icons/tile-ubuntu.svg" alt="">
          <span>Ubuntu (WSL)</span>
        </div>
        <div class="cube" data-type="cmd">
          <img src="icons/tile-cmd.svg" alt="">
          <span>Command Prompt</span>
        </div>
        <div class="cube" data-type="note">
          <img src="icons/tile-notepad.svg" alt="">
          <span>Notepad</span>
        </div>
      </div>
      <div class="launcher-search">
        <input type="text" id="launcher-search-input" placeholder="Search your notes by name or content...">
        <div class="launcher-search-results" id="launcher-search-results" hidden></div>
      </div>
    </div>
    <!-- per-tab panes get injected here -->
  </div>

  <button class="calc-toggle" id="calc-toggle" title="Calculator">&#x25B6;</button>
  <div class="calc-panel" id="calc-panel" hidden>
    <div class="calc-display" id="calc-display">0</div>
    <div class="calc-buttons">
      <button data-k="C">C</button><button data-k="(">(</button><button data-k=")">)</button><button data-k="/">&divide;</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="*">&times;</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="-">&minus;</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="+">+</button>
      <button data-k="0">0</button><button data-k=".">.</button><button data-k="back">&#x232B;</button><button data-k="=" class="calc-eq">=</button>
    </div>
    <button class="calc-adv-toggle" id="calc-adv-toggle">Advanced &#x25BE;</button>
    <div class="calc-advanced" id="calc-advanced" hidden>
      <div class="calc-adv-row">
        <span class="calc-adv-label">f(x) =</span>
        <input type="text" id="calc-graph-expr" placeholder="sin(x)*2">
        <button id="calc-plot-btn">Plot</button>
      </div>
      <canvas id="calc-graph-canvas" width="220" height="160"></canvas>
      <div class="calc-adv-hint">sin cos tan sqrt abs log ln exp floor ceil round, ^ for power, pi and e</div>
    </div>
  </div>

  <div class="find-bar" id="find-bar" hidden>
    <input type="text" id="find-input" placeholder="Find">
    <button id="find-next-btn">Next</button>
    <button id="find-prev-btn">Prev</button>
    <span class="find-replace-only">
      <input type="text" id="replace-input" placeholder="Replace with">
      <button id="replace-btn">Replace</button>
      <button id="replace-all-btn">Replace All</button>
    </span>
    <button id="find-close-btn" title="Close">&#x2715;</button>
  </div>

  <div class="font-panel" id="font-panel" hidden>
    <select id="font-family">
      <option value="Consolas, monospace">Consolas</option>
      <option value="'Segoe UI', sans-serif">Segoe UI</option>
      <option value="Georgia, serif">Georgia</option>
      <option value="'Courier New', monospace">Courier New</option>
      <option value="'Comic Sans MS', sans-serif">Comic Sans MS</option>
    </select>
    <select id="font-size">
      <option>10</option><option>12</option><option selected>14</option>
      <option>16</option><option>18</option><option>24</option><option>32</option>
    </select>
    <button id="font-apply">Apply</button>
    <button id="font-close">&#x2715;</button>
  </div>

  <div class="settings-panel" id="settings-panel" hidden>
    <div class="settings-header">
      <span>Settings</span>
      <button id="settings-close">&#x2715;</button>
    </div>
    <div class="settings-body">
      <div class="settings-row">
        <label>Text transparency</label>
        <select id="set-text-mode">
          <option value="ghost">Fully Transparent</option>
          <option value="faint">Kinda Transparent</option>
          <option value="solid">Solid (Black &amp; White)</option>
        </select>
      </div>
      <div class="settings-row">
        <label>Invert to white text</label>
        <input type="checkbox" id="set-invert">
      </div>
      <div class="settings-row">
        <label>Character glow (auto-contrast outline)</label>
        <input type="checkbox" id="set-char-glow">
      </div>
      <div class="settings-row">
        <label>Legibility aid</label>
        <select id="set-legibility">
          <option value="alpha">Just transparency</option>
          <option value="blur">Blur what's behind it</option>
          <option value="both">Both</option>
        </select>
      </div>
      <div class="settings-row">
        <label>Blur amount</label>
        <input type="range" id="set-blur-amount" min="0" max="20" step="1">
      </div>
      <div class="settings-row">
        <label>Window opacity</label>
        <input type="range" id="set-window-opacity" min="0.1" max="1" step="0.05">
      </div>
      <div class="settings-row">
        <label>Always on top</label>
        <input type="checkbox" id="set-always-on-top">
      </div>
      <div class="settings-row">
        <label>Word wrap</label>
        <input type="checkbox" id="set-word-wrap">
      </div>
      <div class="settings-row">
        <label>Spell check</label>
        <input type="checkbox" id="set-spellcheck">
      </div>
      <div class="settings-row">
        <label>Autosave interval (seconds)</label>
        <input type="number" id="set-autosave-interval" min="5" max="300">
      </div>
      <div class="settings-row">
        <label>Start with Windows</label>
        <input type="checkbox" id="set-start-with-windows">
      </div>
      <div class="settings-row">
        <label>Notes folder</label>
        <div class="settings-note-small" id="set-notes-dir">-</div>
      </div>
      <div class="settings-row">
        <label>Summon hotkey</label>
        <div class="settings-note-small">Ctrl + ` (restart app after changing settings.json to change this)</div>
      </div>
      <div class="settings-row">
        <label>Summon to mouse position</label>
        <input type="checkbox" id="set-summon-at-mouse">
      </div>
      <div class="settings-row">
        <label>Terminal support</label>
        <div class="settings-note-small" id="set-terminal-status">Checking...</div>
      </div>
    </div>
  </div>

  <div class="statusbar" id="statusbar">
    <span id="status-pos">Ln 1, Col 1</span>
    <span id="status-clickthrough" hidden>Click-through: ON (Ctrl+Shift+T to regain control)</span>
    <span id="status-zoom">100%</span>
  </div>

  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="mathexpr.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
